kind = "web"
previewPath = "/"
title = "Garreth Portfolio"
version = "1.0.0"
id = "artifacts/garreth-portfolio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23764

[services.development]
run = "pnpm --filter @workspace/garreth-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/garreth-portfolio", "run", "build" ]
publicDir = "artifacts/garreth-portfolio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23764"
BASE_PATH = "/"
